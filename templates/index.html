<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Insurance Cost Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="bg-light">

<div class="container mt-5 text-center">
    <div class="card shadow p-4 ">
        <h2 class="text-center mb-4 text-primary">Insurance Cost Prediction</h2>
        <button type="button" class="btn btn-outline-success text-success-emphasis rounded-pill" onclick="fillTestData('pred')">Test Prediction 1</button>
        <form action="/predict" method="POST">
            <div class="container text-center">   
                <div class="mb-3">
                {% if prediction_text %}
        <div class="alert alert-warning text-center">
            <strong>{{ prediction_text }}</strong>
        </div>
        <button type="button" class="btn btn-outline-success text-success-emphasis rounded-pill" onclick="fillTestData('pred1')">Test Prediction 2</button>
        {% endif %}
            </div>

            <div class="mb-3">
                <label for="age" class="form-label">Age:</label>
                <input type="number" class="form-control rounded-pill" name="age" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Gender:</label>
                <select class="form-select rounded-pill" name="sex" required>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">BMI:</label>
                <input type="number" class="form-control rounded-pill" step="0.1" name="bmi" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Number of Children:</label>
                <input type="number" class="form-control rounded-pill" name="children" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Smoker:</label>
                <select class="form-select rounded-pill" name="smoker" required>
                    <option value="yes">Smoker</option>
                    <option value="no">Non-Smoker</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="form-label">Region:</label>
                <select class="form-select rounded-pill" name="region" required>
                    <option value="southeast">Southeast</option>
                    <option value="southwest">Southwest</option>
                    <option value="northeast">Northeast</option>
                    <option value="northwest">Northwest</option>
                </select>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-info text-success-emphasis rounded-pill">Predict Cost</button>
            </div>
        </form>

    </div>
    <script>
        function fillTestData(level) {
          const testData = {
            pred: [34, "female", 31.9, 1, "yes", "northeast"],
            pred1: [25, "male", 23.1, 0, "no", "southeast"]
          };
      
          const fields = ["age", "sex", "bmi", "children", "smoker", "region"];
      
          if (testData[level]) {
            fields.forEach((field, i) => {
              document.getElementsByName(field)[0].value = testData[level][i];
            });
          } else {
            console.error("Invalid test data level:", level);
          }
        }
      </script>      
</div>

</body>
</html>
